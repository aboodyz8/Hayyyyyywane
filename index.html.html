
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I love you, Sheshak</title>
  <meta name="description" content="A tiny page that says: I love you, Sheshak.">
  <meta property="og:title" content="I love you, Sheshak">
  <meta property="og:description" content="A tiny page that says: I love you, Sheshak.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#ffffff">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
      background: radial-gradient(1200px 800px at 50% -20%, #ffe6ea, #fff);
    }
    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(2.2rem, 6vw + 1rem, 6rem);
      line-height: 1.05;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    .heart {
      display: inline-block;
      transform: translateY(4px);
      animation: beat 1.2s infinite ease-in-out;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1) translateY(4px); }
      25% { transform: scale(1.08) translateY(4px); }
      50% { transform: scale(0.98) translateY(4px); }
      75% { transform: scale(1.06) translateY(4px); }
    }
    p {
      font-size: clamp(1rem, 1.8vw + 0.6rem, 1.6rem);
      color: #444;
      margin: 0;
    }
    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #777;
    }
    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dashed #bbb;
    }
    a:hover { border-bottom-style: solid; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>I love you, <span class="name">Sheshak</span> <span class="heart">❤️</span></h1>
      <p>Forever and always.</p>
    </div>
  </div>
  <footer>
    Made with ❤️ — <a href="#">for you</a>
  </footer>
</body>
</html>
